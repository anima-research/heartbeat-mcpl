name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Bounds a hung test run, which GitHub would otherwise cancel only after
    # 360 minutes. Node's test runner can loop forever reading a test file's
    # output when what it has buffered starts with V8's serializer header but
    # holds only part of a frame (nodejs/node#62704). The fix shipped in
    # 24.18.0 and 26.2.0, and no 22.x release has it as of 22.23.3, so the
    # floor leg can hit it. Green legs here take under two minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Both ends of the range package.json's engines admits: its floor,
      # pinned exactly (keep the two in step), so a change that needs a newer
      # Node fails here rather than for someone running the floor; and the
      # newest release. Between them, each maintained Node line between
      # those two majors (24 today), since each line ships its own built-in
      # fetch. package.json's @types/node pin names the same floor, so the
      # type check reads that Node's API; it moves with the floor too.
      matrix:
        node: ['22.12.0', '24', 'latest']

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # npm ci installs the lock verbatim and fails on one that is out of
      # sync with package.json.
      - name: Install dependencies (strict lockfile)
        run: npm ci

      # mcpl-harness is not published to npm; the test/*.harness.mjs files load
      # HostSession from a sibling checkout (../mcpl-harness), as the publish
      # workflow's tests do.
      - name: Checkout mcpl-harness (e2e test harness)
        run: |
          git clone --depth 1 https://github.com/anima-research/mcpl-harness.git ../mcpl-harness
          npm install --prefix ../mcpl-harness --omit=dev --no-audit --no-fund

      # npm test builds first (npm run build), so the build runs on each Node,
      # then type-checks the tests (tsc -p test) before running them.
      - name: Test
        run: npm test
