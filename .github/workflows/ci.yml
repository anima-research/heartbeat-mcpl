name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node 22.12.0)
    runs-on: ubuntu-latest
    # Bounds a hung test run, which GitHub would otherwise cancel only after
    # 360 minutes. Node's test runner can loop forever reading a test file's
    # output when what it has buffered starts with V8's serializer header but
    # holds only part of a frame (nodejs/node#62704). The fix shipped in
    # 24.18.0 and 26.2.0, and no 22.x release has it as of 22.23.3, so this
    # job can hit it. A green run takes under two minutes.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      # package.json's engines floor, pinned exactly; keep the two, and the
      # @types/node pin, in step.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      # npm ci installs the lock verbatim and fails on one that is out of
      # sync with package.json.
      - name: Install dependencies (strict lockfile)
        run: npm ci

      # mcpl-harness is not published to npm; the test/*.harness.mjs files load
      # HostSession from a sibling checkout (../mcpl-harness), as the publish
      # workflow's tests do.
      - name: Checkout mcpl-harness (e2e test harness)
        run: |
          git clone --depth 1 https://github.com/anima-research/mcpl-harness.git ../mcpl-harness
          npm install --prefix ../mcpl-harness --omit=dev --no-audit --no-fund

      - name: Test
        run: npm test

  install-and-start:
    name: Install and start (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24', 'latest']

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start
        run: |
          dir=$(mktemp -d)
          code=0
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{"experimental":{"mcpl":{"version":"0.5","pushEvents":true}}},"clientInfo":{"name":"ci-start-check","version":"0"}}}' \
            | HEARTBEAT_CONFIG_FILE="$dir/config.json" HEARTBEAT_REMINDERS_FILE="$dir/reminders.json" timeout -k 5 30 node dist/src/index.js --stdio >"$dir/out" 2>"$dir/err" || code=$?
          if [ "$code" = 124 ] || [ "$code" = 137 ]; then echo "::error::the server didn't exit within 30 s of its input ending"; cat "$dir/err"; exit 1; fi
          if [ "$code" != 0 ]; then echo "::error::the server exited $code"; cat "$dir/err"; exit 1; fi
          node -e '
            const text = require("fs").readFileSync(process.argv[1], "utf8");
            const lines = text === "" ? [] : text.replace(/\n$/, "").split("\n");
            const stray = lines.find((l) => { try { JSON.parse(l); return false; } catch { return true; } });
            if (stray !== undefined) { console.log("::error::the server wrote a line to stdout that is not JSON: " + JSON.stringify(stray)); process.exit(1); }
            const answer = lines.map((l) => JSON.parse(l)).find((m) => m && m.id === 1);
            if (answer?.jsonrpc !== "2.0" || "error" in answer || !answer.result?.serverInfo) { console.log("::error::no successful initialize answer with serverInfo; stdout was:\n" + lines.join("\n")); process.exit(1); }
            console.log(`started: ${answer.result.serverInfo.name} ${answer.result.serverInfo.version}`);
          ' "$dir/out"

      # ICU names a zero offset by version: Node 22.12.0's ICU 76 says GMT,
      # Node 24's ICU 78 says GMT+00:00, and a later ICU may say something
      # else. The tests here meet the real name, in reminder times and in the
      # agent's own times.
      - name: Test zone names (Node ${{ matrix.node }})
        run: node --import tsx --test test/reminder-time.test.ts test/clock.test.ts
